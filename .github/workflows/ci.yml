name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so it is pinned to a release commit.
      # uv's own version comes from `required-version` in pyproject.toml.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # --locked: fail if uv.lock is stale, so CI runs exactly the locally locked tool versions.
      - run: uv sync --locked
      - name: Lint (ruff)
        run: |
          uv run --locked ruff check --output-format github usage_display.py tests
          uv run --locked ruff format --check --output-format github usage_display.py tests
      - name: Type-check (mypy)
        run: uv run --locked mypy
      - name: Tests + coverage
        run: uv run --locked pytest tests --cov --cov-report=term-missing
