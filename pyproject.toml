[project]
name = "openwebui-token-usage-display"
version = "2.6.1"
description = "Open WebUI filter plugin: token usage & cost display below each response"
requires-python = ">=3.11"

# Dev tooling only: the plugin itself has zero runtime dependencies (see CLAUDE.md). Exact
# versions live in uv.lock, which CI installs with `uv sync --locked`, so local and CI tools match.
[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "mypy>=2.3.1",
  # Mirrors the pin Open WebUI ships (0.10.2 through 0.11.3): the plugin runs against this pydantic.
  "pydantic==2.13.4",
]

[tool.uv]
package = false            # a single pasted file, not an installable package
# Floor, not the newest: Dependabot's updater bundles its own uv (0.12.7 on 2026-09-15) and refuses to run
# when it falls below this. uv 0.12.7 verified to produce this exact lock (`uv lock --check`).
required-version = ">=0.12.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true

[tool.coverage.run]
include = ["usage_display.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Every rule is on; each exclusion below names why it does not fit this project. Prefer a per-line
# `# noqa: RULE - reason` for a justified one-off over widening these lists. New rules arrive only
# with a deliberate ruff bump in uv.lock, where CI shows them before merge.
select = ["ALL"]
ignore = [
  "CPY001",   # copyright header per file — the repo is MIT-licensed via LICENSE; the plugin header is OWUI frontmatter.
  "COM812",   # trailing commas — conflicts with `ruff format` (ruff's own formatter-compatibility guidance).
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"usage_display.py" = [
  "ANN401",   # Any for parsed provider JSON (usage/output/model dicts): the payload shape is what the code validates.
]
"tests/*" = [
  "D1",       # test names are the documentation; docstrings only where a case needs explaining.
  "S101",     # pytest asserts.
  "SLF001",   # the plugin is a single file of private helpers; the tests exercise them directly by design.
  "INP001",   # tests/ is a pytest rootdir, not an importable package.
  "PLR2004",  # literal expected values in assertions are the point of a test.
  "ANN401",   # fakes and builders accept arbitrary JSON-like payloads.
  "TRY003",   # fakes raise ad-hoc errors with inline messages to simulate failures.
  "EM101",    # same: inline exception messages in simulated failures.
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
files = ["usage_display.py", "tests/conftest.py", "tests/test_usage_display.py"]

[[tool.mypy.overrides]]
module = ["tiktoken", "aiohttp"]
ignore_missing_imports = true
