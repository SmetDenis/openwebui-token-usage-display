[project]
name = "openwebui-token-usage-display"
version = "2.5.1"
description = "Open WebUI filter plugin: token usage & cost display below each response"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true

[tool.coverage.run]
include = ["usage_display.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "RUF", "PT", "PL", "ANN", "C4", "T20"]
ignore = [
  "ANN401",   # any-type — Any is acceptable around the usage/json helpers.
  "RUF001",   # ambiguous-unicode in strings — glyphs like '·' are intentional.
  "RUF002",   # ambiguous-unicode in docstrings.
  "RUF003",   # ambiguous-unicode in comments.
]

[tool.ruff.lint.per-file-ignores]
"usage_display.py" = [
  "E501",     # docstring frontmatter: OWUI parses one `key: value` per line — wrapping truncates it.
  "PLR0913",  # the 13 _render_* + _build_stats share a fixed 6-arg signature for uniform dispatch.
  "PLR0912",  # too-many-branches — provider/API-shape handling has many conditionals.
  "PLR2004",  # magic-value — formatting/threshold constants are pinned to spec.
  "SIM117",   # nested `async with` in the aiohttp probes reads clearer than a combined form.
]
"tests/*" = ["PLR2004", "ANN", "S101", "T201", "PLR0913", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
files = ["usage_display.py", "tests/conftest.py", "tests/test_usage_display.py"]

[[tool.mypy.overrides]]
module = ["tiktoken", "aiohttp"]
ignore_missing_imports = true
